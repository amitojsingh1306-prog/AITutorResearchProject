<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#1677ef" stroke-width="1.2"/></marker></defs><rect width="1600" height="960" fill="white"/><g font-family="Arial, sans-serif" fill="#12243c"><text x="60" y="65" font-size="42">LLD</text><text x="60" y="108" font-size="22" fill="#526174">Actual function calls in the current streaming path</text><path d="M360,250 H430" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730,250 H800" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1100,250 H1170" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1320,320 V390" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1170,460 H1100" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M800,460 H730" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M430,460 H360" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M210,530 V600" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M360,670 H430" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730,670 H800" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1100,670 H1170" fill="none" stroke="#1677ef" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="60" y="180" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="80" y="215" font-size="23" font-weight="bold">1  Send message</text><text x="80" y="250" font-size="19">sendMessage()</text><text x="80" y="275" font-size="19">streamMessage()</text><rect x="430" y="180" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="450" y="215" font-size="23" font-weight="bold">2  Receive request</text><text x="450" y="250" font-size="19">FastAPI to ChatService</text><text x="450" y="275" font-size="19">stream_message()</text><rect x="800" y="180" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="820" y="215" font-size="23" font-weight="bold">3  Check commands</text><text x="820" y="250" font-size="19">control()</text><text x="820" y="275" font-size="19">Edit / forget routing</text><rect x="1170" y="180" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="1190" y="215" font-size="23" font-weight="bold">4  Save user record</text><text x="1190" y="250" font-size="19">save_message()</text><text x="1190" y="275" font-size="19">JSON + MySQL + summary</text><rect x="1170" y="390" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="1190" y="425" font-size="23" font-weight="bold">5  Index text</text><text x="1190" y="460" font-size="19">embed() then upsert()</text><text x="1190" y="485" font-size="19">Nomic vectors in Chroma</text><rect x="800" y="390" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="820" y="425" font-size="23" font-weight="bold">6  Synchronize graph</text><text x="820" y="460" font-size="19">Neo4jMemory.sync()</text><text x="820" y="485" font-size="19">User sources + facts</text><rect x="430" y="390" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="450" y="425" font-size="23" font-weight="bold">7  Gather evidence</text><text x="450" y="460" font-size="19">_direct_stream_reply()</text><text x="450" y="485" font-size="19">_prepare_context()</text><rect x="60" y="390" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="80" y="425" font-size="23" font-weight="bold">8  Select context</text><text x="80" y="460" font-size="19">select_template()</text><text x="80" y="485" font-size="19">Cutoff / dedup / budget</text><rect x="60" y="600" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="80" y="635" font-size="23" font-weight="bold">9  Call local model</text><text x="80" y="670" font-size="19">stream_reply()</text><text x="80" y="695" font-size="19">Local /chat/completions</text><rect x="430" y="600" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="450" y="635" font-size="23" font-weight="bold">10  Display chunks</text><text x="450" y="670" font-size="19">_sse() to onChunk()</text><text x="450" y="695" font-size="19">React formats response</text><rect x="800" y="600" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="820" y="635" font-size="23" font-weight="bold">11  Save assistant</text><text x="820" y="670" font-size="19">Revision check</text><text x="820" y="695" font-size="19">save_message()</text><rect x="1170" y="600" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="1190" y="635" font-size="23" font-weight="bold">12  Complete request</text><text x="1190" y="670" font-size="19">_sse("done") / onDone()</text><text x="1190" y="695" font-size="19">Persisted reply in React</text><text x="60" y="806" font-size="21" fill="#526174">Command branch at step 3: edit/forget → _apply() → reconcile JSON, SQL, vectors, graph and summaries.</text><text x="60" y="852" font-size="21" fill="#526174">Offline: seed_corpus() → _prepare_context() → local generation → upstream scorer → independent audit.</text><text x="60" y="898" font-size="19" fill="#526174">Explicit attachments add OCR evidence. Full image-lineage isolation remains a proposed extension.</text></g></svg>