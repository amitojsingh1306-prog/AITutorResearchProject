ynchronize local MySQL</text><rect x="1170" y="170" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="1190" y="205" font-size="23" font-weight="bold">4  Retrieve memory</text><text x="1190" y="240" font-size="19">Recent history / summary</text><text x="1190" y="265" font-size="19">Chroma vectors / Neo4j</text><rect x="1170" y="410" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="1190" y="445" font-size="23" font-weight="bold">5  Build prompt</text><text x="1190" y="480" font-size="19">Blueprint + evidence</text><text x="1190" y="505" font-size="19">Fit input budget</text><rect x="800" y="410" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="820" y="445" font-size="23" font-weight="bold">6  Local generation</text><text x="820" y="480" font-size="19">LM Studio: Qwen 1.5B</text><text x="820" y="505" font-size="19">Selected text to answer</text><rect x="430" y="410" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="450" y="445" font-size="23" font-weight="bold">7  Stream to React</text><text x="450" y="480" font-size="19">FastAPI text chunks</text><text x="450" y="505" font-size="19">React code formatting</text><rect x="60" y="410" width="300" height="140" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="80" y="445" font-size="23" font-weight="bold">8  Save reply</text><text x="80" y="480" font-size="19">Persist JSON / MySQL</text><text x="80" y="505" font-size="19">Refresh memory indexes</text><text x="60" y="600" font-size="20" fill="#526174">Updates and forgetting: FastAPI coordinates source changes and derived-store cleanup.</text><text x="60" y="663" font-size="23" font-weight="bold">Offline LoCoMo evaluation</text><rect x="60" y="700" width="300" height="112" rx="12" fill="#e7f1ff" stroke="#1677ef" stroke-width="1.4"/><text x="80" y="742" font-size="22" font-weight="bo